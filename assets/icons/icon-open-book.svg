<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bookBg)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="8" />
  <!-- Open book pages contour -->
  <path d="M 100 370 Q 256 340 256 390 Q 256 340 412 370 L 412 210 Q 256 180 256 230 Q 256 180 100 210 Z" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="6" />
  <!-- Central Character -->
  <text x="50%" y="46%" text-anchor="middle" dominant-baseline="central" 
        font-family="'Noto Serif TC', 'Songti TC', 'Apple LiSung', 'STSong', serif" 
        font-size="240" font-weight="900" fill="#34d399" 
        style="text-shadow: 0 4px 16px rgba(0,0,0,0.3);">字</text>
  <!-- Sparkle -->
  <path d="M 390 100 Q 390 125 415 125 Q 390 125 390 150 Q 390 125 365 125 Q 390 125 390 100 Z" fill="#fbbf24" />
</svg>
