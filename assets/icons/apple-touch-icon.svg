<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background (no transparency to avoid black edges on iOS / Android Home Screen) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />

  <!-- Decorative oriental inner border -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="6" stroke-dasharray="12 10" />

  <!-- Traditional Hanzi Character 漢 -->
  <text x="50%" y="53%" text-anchor="middle" dominant-baseline="central" 
        font-family="'Noto Serif TC', 'Songti TC', 'Apple LiSung', 'STSong', serif" 
        font-size="310" font-weight="900" fill="#ffffff" 
        style="text-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);">漢</text>

  <!-- Memory & Wisdom Golden Sparkle -->
  <path d="M 410 75 Q 410 110 445 110 Q 410 110 410 145 Q 410 110 375 110 Q 410 110 410 75 Z" fill="url(#goldGrad)" />
</svg>
