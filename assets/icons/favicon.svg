<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer squircle badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" stroke="rgba(255, 255, 255, 0.28)" stroke-width="8" />

  <!-- Decorative oriental seal inner border -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" stroke-dasharray="10 8" />

  <!-- Traditional Hanzi Character 漢 -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" 
        font-family="'Noto Serif TC', 'Songti TC', 'Apple LiSung', 'STSong', serif" 
        font-size="285" font-weight="900" fill="#ffffff" 
        style="text-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);">漢</text>

  <!-- Memory & Wisdom Golden Sparkle -->
  <path d="M 400 85 Q 400 115 430 115 Q 400 115 400 145 Q 400 115 370 115 Q 400 115 400 85 Z" fill="url(#goldGrad)" />
</svg>
